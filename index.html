<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工單操作</title>
<style>
  :root { --bg: #fff; --fg: #1f2937; --muted: #6b7280; --line: #d1d5db; --accent: #06c755; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  textarea { width: 100%; min-height: 160px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  button:disabled { opacity: .5; }
  #error { margin-top: 12px; color: #c0392b; }
</style>
</head>
<body>
<main id="form" hidden>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <label id="label" for="note"></label>
  <textarea id="note" maxlength="1000"></textarea>
  <button id="submit" type="button">送出</button>
</main>
<main id="done" hidden>
  <h1>還差一步</h1>
  <p id="done-message"></p>
  <textarea id="command" readonly></textarea>
</main>
<div id="error" role="alert"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '2012317534-uQ4HQu9A';

  // 送出的文字由 Bot 的 webhook 接收，因此能用 reply 回卡片，不耗 push 額度
  const ACTIONS = {
    close: { command: '結案', label: '處理說明' },
    cancel: { command: '取消', label: '原因' },
    wait: { command: '等待客戶', label: '原因' },
    transfer: { command: '轉單', label: '原因' }
  };

  const $ = function (id) { return document.getElementById(id); };
  const showError = function (message) { $('error').textContent = message; };

  // 瀏覽器無法以使用者身分送訊息，改由使用者把指令貼到群組，Bot 一樣能用 reply 回卡片
  async function showCommand(text) {
    $('form').hidden = true;
    $('command').value = text;
    $('done').hidden = false;
    $('command').select();
    $('done-message').textContent = '請複製下面的內容，到 LINE 群組貼上並送出。';
    try {
      await navigator.clipboard.writeText(text);
      $('done-message').textContent = '已複製，請到 LINE 群組貼上並送出。';
    } catch (err) {
      // 維持手動複製的提示
    }
  }

  async function main() {
    await liff.init({ liffId: LIFF_ID });
    const params = new URLSearchParams(location.search);
    const ticket = params.get('ticket') || '';
    const action = ACTIONS[params.get('action')];
    const target = params.get('target') || '';

    if (!action || !/^(ICT\d{4}|(ICT)?\d{8})-\d+$/.test(ticket) ||
        (params.get('action') === 'transfer' && !/^U[0-9a-f]{32}$/.test(target))) {
      showError('連結內容不正確，請回到群組重新操作。');
      return;
    }
    const inClient = liff.isInClient();
    if (!inClient) $('submit').textContent = '複製指令';

    // 群組內不顯示年份，Bot 收到後會對應回完整編號
    const shortTicket = ticket.replace(/^(ICT)?\d{4}(\d{4}-)/, '$1$2');
    $('title').textContent = action.command + ' ' + shortTicket;
    $('subtitle').textContent = target ? (params.get('company') || '') + '｜轉單給：' + (params.get('name') || '') : '';
    $('label').textContent = action.label + '（必填）';
    $('form').hidden = false;

    $('submit').addEventListener('click', async function () {
      const note = $('note').value.trim();
      if (!note) {
        showError('請填寫' + action.label + '。');
        return;
      }
      showError('');
      $('submit').disabled = true;
      const lines = ['#' + action.command + ' ' + shortTicket];
      if (target) lines.push('對象ID：' + target);
      lines.push(action.label + '：' + note);
      if (!inClient) {
        await showCommand(lines.join('\n'));
        return;
      }
      try {
        await liff.sendMessages([{ type: 'text', text: lines.join('\n') }]);
        liff.closeWindow();
      } catch (err) {
        $('submit').disabled = false;
        showError('送出失敗：' + err.message);
      }
    });
  }

  main().catch(function (err) { showError('初始化失敗：' + err.message); });
</script>
</body>
</html>
